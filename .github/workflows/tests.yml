# Тесты без LLM на каждый push: PostgreSQL + pgvector, синтетические данные, pytest.
# Качество ответов модели проверяется отдельно (eval/, нужна локальная LLM).
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci
      REQUIRE_DB: "1"          # тесты с БД должны выполниться, а не пропуститься
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Синтетические данные
        run: python -m data.generate
      - name: Тесты
        run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка compose.yaml
        run: docker compose config --quiet && docker compose --profile ollama config --quiet
      - name: Сборка образа
        run: docker build -t itp-agent .
      - name: Код в образе импортируется
        run: docker run --rm itp-agent python -c "import api, data.bootstrap; print('ok')"
